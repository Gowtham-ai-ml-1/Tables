<head>

    <title>Course Registration</title>

<body>
    <h1>Course Registration</h1>
    <fieldset>
        <legend>Personal Details</legend>

        <form action="Thankyou.html">
            <table>
                <tr>
                    <td>
                        <label for="1"> First Name :</label>
                    </td>
                    <td>
                        <input type="text" name="FN" id="1" placeholder="Enter your first name....." /><br />
                    </td>

                </tr>
                <tr>
                    <td>
                        <label for="2">Second Name :</label>
                    </td>
                    <td>
                        <input type="text" name="SN" id="2" placeholder="Enter your Second name....." /><br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="3">Mobile Number :</label>
                    </td>
                    <td>
                        <input type="number" name="MB" id="3" placeholder="Enter your Mobile Number....." /><br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="4">Email :</label>

                    </td>
                    <td>
                        <input type="email" name="email" id="4" placeholder="Enter your email ....." /><br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="5">Pass Word :</label>
                    </td>
                    <td>
                        <input type="password" name="PW" id="5" placeholder="Enter your PassWord ....." /><br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="6"> Conform PassWord :</label>
                    </td>
                    <td>
                        <input type="password" name="PW" id="6" placeholder="Enter your PassWord ....." /><br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="7">DOB :</label>
                    </td>
                    <td>
                        <input type="date" name="DOB" id="7" /><br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="8">Gender:</label>
                    </td>
                    <td>
                        <input type="radio" name="gender" id="8" />Male
                        <input type="radio" name="gender" id="8" />Female
                        <input type="radio" name="gender" id="8" />Other <br />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="9">Select Country :</label>
                    </td>
                    <td>
                        <select name="country" id="9">
                            <option value="india">India</option>
                            <option value="USA">USA</option>
                        </select><br />
                    </td>
                </tr>

                <tr>
                    <td> <label for="10">Upload Picture:</label></td>
                    <td><input type="file" id="10" /><br /></td>
                </tr>
            </table>
            <label for="11">Read T/C:</label></td>

            <input type="checkbox" name="T/C" id="11"></td><br>

            <input type="reset" /><br />
            <input type="submit" />


        </form>
    </fieldset>
    </form>
</body>

</html>
