<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STUDENT RESISTRATION FORM</title>
    <link rel="stylesheet" href="form_project.css" />
  </head>
  <style></style>

  <body>
    <div>
      <h1 class="h1">STUDENT RESISTRATION FORM</h1>
    </div>

    <div class="form-cointainer">
      <div class="name">
        <label for="Full Name:">Full Name</label>
        <input type="text" name="Full Name" id="Full Name" />
      </div>

      <div class="name">
        <label for="Email">Email</label>
        <input type="Email" name="Email" id="Email" />
      </div>

      <div class="name">
        <label for="Password">Password</label>
        <input type="password" name="Password" id="Password" />
      </div>

      <div class="name">
        <label for="Age">Age</label>
        <input type="text" name="Age" id="Age" />
      </div>

      <div class="name">
        <label for="Gender:">Gender</label>

        <input type="radio" name="Gender" id="Gender" vlaue="Male" />
        <label for="Gender">Male</label>
        <input type="radio" name="Gender" id="Gender" value="Female" />
        <label for="Gender">Female</label>
        <input type="radio" name="Gender" id="Gender" value="Other" />
        <label for="Gender">Other</label>
      </div>

      <div class="name">
        <label for="course_select">Course</label>
        <select name="Course" id="course_select">
          <option value="select Course">Select Course</option>
          <option value="CSE-AI">CSE-AI/ML</option>
          <option value="CSE-DS">CSE-DS</option>
          <option value="CSE">CSE</option>
          <option value="EEE">EEE</option>
          <option value="ECE">ECE</option>
          <option value="ME">ME</option>
          <option value="CIVIL">CIVIL</option>
          <option value="ARTS">ARTS</option>
        </select>
      </div>

      <div class="name">
        <label for="">Skills</label>

        <input type="checkbox" name="skills" id="Skills" />
        <label for="Skills" name="skills" id="HTML">HTML</label>
      </div>
      <div class="name">
        <input type="checkbox" name="skills" id="PYTHON" />
        <label for="PYTHON">PYTHON</label>
      </div>

      <div class="name">
        <input type="checkbox" name="skills" id="CSS" />
        <label for="CSS">CSS</label>
      </div>
      <div class="name">
        <input type="checkbox" name="skills" id="Java script" />
        <label for="Java script">JAVA SCRIPT</label>
      </div>

      <div class="name">
        <label for="address">Address</label>
        <input type="text" name="Address" id="address" />
      </div>

      <div class="name">
        <label for="MARKS">MARKS IN 12th</label>
        <input type="number" name="marks" id="MARKS" />
      </div>

      <div class="name">
        <label for="DATE">DATE</label>
        <input type="date" name="date" id="DATE" />
      </div>
      <div class="name">
      <label for="Review">Review</label>
      <input type="text" name="review" id="Review" lenght="200px" height="250px">
      </div>

      <div></div>
    </div>
  </body>
</html>
